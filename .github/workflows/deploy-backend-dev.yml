name: Deploy Backend Dev

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Azure resource group
        required: false
        default: rg-agent86-dev
      image_tag:
        description: Optional image tag to deploy (defaults to the triggering commit SHA)
        required: false
      deploy_mcp:
        description: Deploy MCP container app
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${{ inputs.image_tag }}"
          if [[ -z "$image_tag" ]]; then
            image_tag="${GITHUB_SHA::12}"
          fi
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "Deploying immutable image tag: $image_tag"

      - name: Resolve resource names and secrets
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          az() {
            local attempt=1
            local max_attempts=5
            local delay_seconds=2
            local exit_code

            while true; do
              command az "$@" && return 0
              exit_code=$?
              if [[ "$exit_code" -eq 2 ]]; then
                echo "Azure CLI rejected the command arguments; not retrying: az $*" >&2
                return "$exit_code"
              fi
              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "Azure CLI command failed after $attempt attempt(s): az $*" >&2
                return "$exit_code"
              fi

              echo "Azure CLI command failed (attempt $attempt/$max_attempts, exit $exit_code); retrying in $delay_seconds seconds..." >&2
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done
          }

          rg="${{ inputs.resource_group }}"

          require_single_name() {
            local label="$1"
            shift
            mapfile -t items < <("$@")
            local filtered=()
            local item
            for item in "${items[@]}"; do
              [[ -n "$item" ]] && filtered+=("$item")
            done
            if [[ ${#filtered[@]} -eq 0 ]]; then
              echo "Error: no $label resources found in '$rg'." >&2
              exit 1
            fi
            if [[ ${#filtered[@]} -gt 1 ]]; then
              echo "Error: multiple $label resources found in '$rg': ${filtered[*]}" >&2
              exit 1
            fi
            printf '%s\n' "${filtered[0]}"
          }

          kv_name=$(require_single_name "Key Vault" az keyvault list --resource-group "$rg" --query '[].name' --output tsv)
          cosmos_account=$(require_single_name "Cosmos DB account" az cosmosdb list --resource-group "$rg" --query '[].name' --output tsv)
          storage_account=$(require_single_name "Storage account matching agent86" az storage account list --resource-group "$rg" --query "[?contains(name, 'agent86')].name" --output tsv)
          cosmos_key=$(az keyvault secret show --vault-name "$kv_name" --name cosmos-key --query value --output tsv)
          blob_connection_string=$(az keyvault secret show --vault-name "$kv_name" --name azure-blob-connection-string --query value --output tsv)
          foundry_api_key=$(az keyvault secret show --vault-name "$kv_name" --name foundry-openai-api-key --query value --output tsv)
          appinsights_connection_string=$(az keyvault secret show --vault-name "$kv_name" --name applicationinsights-connection-string --query value --output tsv 2>/dev/null || true)
          cosmos_endpoint=$(az cosmosdb show --resource-group "$rg" --name "$cosmos_account" --query documentEndpoint --output tsv)
          echo "storage_account=$storage_account" >> "$GITHUB_OUTPUT"
          echo "kv_name=$kv_name" >> "$GITHUB_OUTPUT"
          echo "cosmos_endpoint=$cosmos_endpoint" >> "$GITHUB_OUTPUT"
          echo "cosmos_key=$cosmos_key" >> "$GITHUB_OUTPUT"
          echo "blob_connection_string=$blob_connection_string" >> "$GITHUB_OUTPUT"
          echo "foundry_api_key=$foundry_api_key" >> "$GITHUB_OUTPUT"
          echo "appinsights_connection_string=$appinsights_connection_string" >> "$GITHUB_OUTPUT"

      - name: Deploy backend services
        shell: bash
        run: |
          set -euo pipefail
          az() {
            local attempt=1
            local max_attempts=5
            local delay_seconds=2
            local exit_code

            while true; do
              command az "$@" && return 0
              exit_code=$?
              if [[ "$exit_code" -eq 2 ]]; then
                echo "Azure CLI rejected the command arguments; not retrying: az $*" >&2
                return "$exit_code"
              fi
              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "Azure CLI command failed after $attempt attempt(s): az $*" >&2
                return "$exit_code"
              fi

              echo "Azure CLI command failed (attempt $attempt/$max_attempts, exit $exit_code); retrying in $delay_seconds seconds..." >&2
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done
          }
          export -f az

          echo "Azure CLI version: $(command az version --query '"azure-cli"' --output tsv)"
          command az containerapp create --help | grep -q -- '--env-vars'
          command az containerapp update --help | grep -q -- '--replace-env-vars'
          command az containerapp secret set --help | grep -q -- '--secrets'

          cmd=(
            bash "${{ github.workspace }}/common/scripts/azure_container_apps/deploy_agent86_services.sh"
            --resource-group "${{ inputs.resource_group }}"
            --image-tag "${{ steps.image.outputs.tag }}"
            --api-env "APP_NAME=agent-86"
            --api-env "APP_ENV=dev"
            --api-env "CORS_ALLOWED_ORIGINS=https://swa-agent86-dev.azurestaticapps.net"
            --api-env "ENTRA_TENANT_ID=${{ vars.ENTRA_TENANT_ID }}"
            --api-env "ENTRA_API_CLIENT_ID=${{ vars.ENTRA_API_CLIENT_ID }}"
            --api-env "ENTRA_API_AUDIENCE=${{ vars.ENTRA_API_AUDIENCE }}"
            --api-env "COSMOS_ENDPOINT=${{ steps.resolve.outputs.cosmos_endpoint }}"
            --api-env "COSMOS_DATABASE_NAME=agent86"
            --api-env "COSMOS_SESSIONS_CONTAINER_NAME=sessions"
            --api-env "COSMOS_MESSAGES_CONTAINER_NAME=messages"
            --api-env "COSMOS_ARTIFACTS_CONTAINER_NAME=artifacts"
            --api-env "COSMOS_SUMMARIES_CONTAINER_NAME=summaries"
            --api-env "AZURE_BLOB_CONTAINER_NAME=agent86-artifacts"
            --api-env "FOUNDRY_OPENAI_BASE_URL=${{ vars.FOUNDRY_OPENAI_BASE_URL }}"
            --api-env "FOUNDRY_DEFAULT_CHAT_MODEL=${{ vars.FOUNDRY_DEFAULT_CHAT_MODEL }}"
            --api-env "FOUNDRY_PREMIUM_CHAT_MODEL=${{ vars.FOUNDRY_PREMIUM_CHAT_MODEL }}"
            --api-secret "COSMOS_KEY=${{ steps.resolve.outputs.cosmos_key }}"
            --api-secret "AZURE_BLOB_CONNECTION_STRING=${{ steps.resolve.outputs.blob_connection_string }}"
            --api-secret "FOUNDRY_OPENAI_API_KEY=${{ steps.resolve.outputs.foundry_api_key }}"
          )
          if [[ -n "${{ steps.resolve.outputs.appinsights_connection_string }}" ]]; then
            cmd+=(--api-secret "APPLICATIONINSIGHTS_CONNECTION_STRING=${{ steps.resolve.outputs.appinsights_connection_string }}")
          fi
          if [[ "${{ inputs.deploy_mcp }}" == "true" ]]; then
            cmd+=(--deploy-mcp)
          fi
          "${cmd[@]}"

      - name: Smoke test backend
        shell: bash
        run: |
          set -euo pipefail
          az() {
            local attempt=1
            local max_attempts=5
            local delay_seconds=2
            local exit_code

            while true; do
              command az "$@" && return 0
              exit_code=$?
              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "Azure CLI command failed after $attempt attempt(s): az $*" >&2
                return "$exit_code"
              fi

              echo "Azure CLI command failed (attempt $attempt/$max_attempts, exit $exit_code); retrying in $delay_seconds seconds..." >&2
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done
          }

          api_url=$(az containerapp show --resource-group "${{ inputs.resource_group }}" --name aca-agent86-api-dev --query properties.configuration.ingress.fqdn --output tsv)
          curl -fsS "https://$api_url/health" || curl -fsS "https://$api_url/docs" >/dev/null