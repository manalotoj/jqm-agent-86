name: Deploy Frontend Dev

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Azure resource group
        required: false
        default: rg-agent86-dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Resolve deploy metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          rg="${{ inputs.resource_group }}"

          require_single_name() {
            local label="$1"
            shift
            mapfile -t items < <("$@")
            local filtered=()
            local item
            for item in "${items[@]}"; do
              [[ -n "$item" ]] && filtered+=("$item")
            done
            if [[ ${#filtered[@]} -eq 0 ]]; then
              echo "Error: no $label resources found in '$rg'." >&2
              exit 1
            fi
            if [[ ${#filtered[@]} -gt 1 ]]; then
              echo "Error: multiple $label resources found in '$rg': ${filtered[*]}" >&2
              exit 1
            fi
            printf '%s\n' "${filtered[0]}"
          }

          swa_name=$(require_single_name "Static Web App" az staticwebapp list --resource-group "$rg" --query '[].name' --output tsv)
          swa_hostname=$(az staticwebapp show --resource-group "$rg" --name "$swa_name" --query defaultHostname --output tsv)
          api_fqdn=$(az containerapp show --resource-group "$rg" --name aca-agent86-api-dev --query properties.configuration.ingress.fqdn --output tsv)
          kv_name=$(require_single_name "Key Vault" az keyvault list --resource-group "$rg" --query '[].name' --output tsv)
          deployment_token=$(az keyvault secret show --vault-name "$kv_name" --name azure-static-web-app-deployment-token --query value --output tsv)
          echo "swa_name=$swa_name" >> "$GITHUB_OUTPUT"
          echo "swa_hostname=$swa_hostname" >> "$GITHUB_OUTPUT"
          echo "api_url=https://$api_fqdn" >> "$GITHUB_OUTPUT"
          echo "deployment_token=$deployment_token" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_REDIRECT_URI: https://${{ steps.metadata.outputs.swa_hostname }}
          VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
          VITE_API_BASE_URL: ${{ steps.metadata.outputs.api_url }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.metadata.outputs.deployment_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # With skip_app_build enabled, Static Web Apps uploads app_location
          # directly. Point at Vite's generated assets, not the source folder
          # containing node_modules.
          app_location: frontend/dist
          output_location: ""
          skip_app_build: true

      - name: Smoke test frontend
        run: curl -fsS "https://${{ steps.metadata.outputs.swa_hostname }}" >/dev/null